
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Competition Tracker</h1>
        <p>Find and organize competition results.</p>
    </header>


    <main>

        <section>
            <h2>Create an account</h2>

            <form id="registerForm">
                <input type="email"
                       id="registerEmail"
                       placeholder="Email"
                       required>

                <input type="password"
                       id="registerPassword"
                       placeholder="Password"
                       required>

                <button type="submit">Register</button>
            </form>

            <p id="registerMessage"></p>
        </section>

        <hr>

        <section>
            <h2>Log in</h2>

            <form id="loginForm">
                <input type="email"
                       id="loginEmail"
                       placeholder="Email"
                       required>

                <input type="password"
                       id="loginPassword"
                       placeholder="Password"
                       required>

                <button type="submit">Log in</button>
            </form>

            <p id="loginMessage"></p>
        </section>

        <div id="accountSection">
            <p id="accountStatus">Checking login status...</p>
            <button id="logoutButton" hidden>Log out</button>
        </div>

        <h2>Search Competition Results</h2>

        <input type="text"
               id="participant"
               placeholder="Participant name">

        <input type="text"
               id="competition"
               placeholder="Competition name">

        <input type="number"
               id="year"
               placeholder="Year">

        <button onclick="searchResults()">Search</button>

        <div id="results"></div>

        <h2>My Library</h2>

        <button onclick="loadLibrary()">Refresh Library</button>

        <div id="library">
            Your saved results will appear here.
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
